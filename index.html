<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <meta name="google-site-verification" content="zQm3nY86MHOTgdKA8CVEhp42CNFmqAXYKwPCattBSvQ" />

    <title>MA & KAGE | Official Site</title>
    <meta name="description" content="MA & KAGEの公式サイトです。日本の職人技、美学、空間、そして影の幾何学をリイマジンするポートフォリオを展開。">
    <meta name="keywords" content="MA & KAGE, MA&KAGE, マーアンドカゲ, 日本の職人技, ミニマリズム, ポートフォリオ">

    <style>
        /* 1. 究極のミニマリズムのための初期化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            font-weight: 200;
            letter-spacing: 0.4em;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* 2. 1画面ごとに完結するセクション設定 */
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000000;
            scroll-snap-align: start;
        }

        /* 3. 背景画像の調整（スマホでもバグらない最強パララックス） */
        .bg-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            clip: rect(0, auto, auto, 0);
            clip-path: inset(0 0 0 0);
            /* 背後の画像に触れないようにしてリンクの邪魔をさせない */
            pointer-events: none;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: brightness(0.55) contrast(1.15);
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* 4. テキストのオーバーレイ（最前面に引っ張り出す） */
        .content {
            position: relative;
            z-index: 10; /* ここを大きくして透明な壁を突き破りました */
            text-align: center;
            padding: 0 20px;
            width: 100%;
        }

        /* 5. 文字のサイズ（ミニマル・豆粒デザイン） */
        h1 {
            font-size: 1.2rem;
            font-weight: 200;
            margin-bottom: 20px; 
            color: #ffffff;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            h1 { font-size: 1.5rem; margin-bottom: 30px; }
        }

        p {
            font-size: 0.6rem;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 0.5em;
        }

        @media (min-width: 768px) {
            p { font-size: 0.65rem; }
        }

        .statement {
            font-size: 0.9rem;
            line-height: 2.5;
            color: #cccccc;
            font-weight: 200;
            letter-spacing: 0.3em;
        }

        @media (min-width: 768px) {
            .statement { font-size: 1.1rem; line-height: 3; letter-spacing: 0.4em; }
        }

        /* 6. 連絡先チャンネル */
        .info-channels {
            font-size: 0.7rem;
            color: #888888;
            line-height: 2.5; 
        }

        @media (min-width: 768px) {
            .info-channels { font-size: 0.75rem; line-height: 3; }
        }

        .info-channels a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.4s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            /* 確実にタップできるようにするお守り */
            position: relative;
            z-index: 20;
        }

        .info-channels a:hover {
            color: #888888;
            border-bottom-color: #888888;
        }

        .scroll-line {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, #333, transparent);
            z-index: 2;
        }

        @media (min-width: 768px) {
            .scroll-line { bottom: 40px; height: 60px; }
        }

        .coming-soon-text {
            font-family: 'Cinzel', serif;
            font-size: 1.0rem;
            color: #ffffff;
            letter-spacing: 0.5em;
            line-height: 2;
        }

        @media (min-width: 768px) {
            .coming-soon-text { font-size: 1.2rem; letter-spacing: 0.6em; }
        }
    </style>
