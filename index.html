<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>MA & KAGE | Official Site</title>
    <style>
        /* 1. ミニマリズムのための初期化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            font-weight: 200;
            letter-spacing: 0.4em;
            overflow-x: hidden;
        }

        /* 2. 1画面ごとにスクロールがピタッと止まる設定 */
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000000;
            scroll-snap-align: start;
        }

        /* 3. 背景画像の調整 */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: brightness(0.55) contrast(1.15);
            z-index: 1;
        }

        /* 4. テキストのオーバーレイ */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }

        /* 5. 文字のデザイン */
        h1 {
            font-size: 1.5rem;
            font-weight: 200;
            margin-bottom: 30px; 
            color: #ffffff;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        p {
            font-size: 0.65rem;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 0.5em;
        }

        .statement {
            font-size: 1.1rem;
            line-height: 3;
            color: #cccccc;
            font-weight: 200;
            letter-spacing: 0.4em;
        }

        /* 6. 連絡先 */
        .info-channels {
            font-size: 0.75rem;
            color: #888888;
            line-height: 3; 
        }

        .info-channels a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.4s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }

        .info-channels a:hover {
            color: #888888;
            border-bottom-color: #888888;
        }

        .scroll-line {
            position: absolute;
            bottom: 40px;
            left: 50%;
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, #333, transparent);
            z-index: 2;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@200;400&family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">
</head>
<body>

    <section id="hero">
        <div class="bg-image" style="background-image: url('./縦長モノクロの小滝.png');"></div>
        <div class="scroll-line"></div>
    </section>

    <section id="statement">
        <div class="bg-image" style="background-image: url('./Sacred Void.png');"></div>
        <div class="content">
            <p class="statement" style="font-family: 'Cinzel', serif;">
                Japanese Craftsmanship, Reimagined.
            </p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="space">
        <div class="bg-image" style="background-image: url('./Minimal Japanese Silence.png');"></div>
        <div class="content">
            <h1>SILENCE</h1>
            <p>The Aesthetics of Absence</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="craft">
        <div class="bg-image" style="background-image: url('./Kumiko Shadow on Washi Paper.png');"></div>
        <div class="content">
            <h1>SHADE</h1>
            <p>Geometry of Wood and Light</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="shade-interior">
        <div class="bg-image" style="background-image: url('./additional-image.png');"></div>
        <div class="content">
            <h1>INTERIOR SHADE</h1>
            <p>Geometry of Wood and Light</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="staircase">
        <div class="bg-image" style="background-image: url('./Staircase in Shadow Light.png');"></div>
        <div class="content">
            <h1>LIGHT AND LINE</h1>
            <p>The Architecture of Shadow</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="contact" style="background-color: #000000;">
        <div class="content">
            <h1>CONTACT</h1>
             
            <div class="info-channels">
                <p>MAIL: <a href="mailto:info@ma-and-kage.com">info@ma-and-kage.com</a></p>
                <p>INSTAGRAM: <a href="https://instagram.com/ma_and_kage" target="_blank">@ma_and_kage</a></p>
            </div>
        </div>
    </section>

</body>
</html>
