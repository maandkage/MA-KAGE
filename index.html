<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <meta name="google-site-verification" content="zQm3nY86MHOTgdKA8CVEhp42CNFmqAXYKwPCattBSvQ" />

    <title>MA & KAGE | Official Site</title>
    <meta name="description" content="MA & KAGEの公式サイトです。日本の職人技、美学、空間、そして影の幾何学をリイマジンするポートフォリオを展開。">
    <meta name="keywords" content="MA & KAGE, MA&KAGE, マーアンドカゲ, 日本の職人技, ミニマリズム, ポートフォリオ">

    <style>
        /* 1. 初期化（余計な隙間をなくす） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            font-weight: 200;
            letter-spacing: 0.4em;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* 2. 1画面ごとに完結するセクション設定 */
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000000;
            scroll-snap-align: start;
        }

        /* 3. 背景画像の調整（スマホで100%エラーを起こさない安全設定） */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: brightness(0.55) contrast(1.15);
            z-index: 1;
            
            /* スマホでは拡大バグを起こさないよう、通常のスクロールに設定 */
            background-attachment: scroll;
        }

        /* パソコンの大画面（横幅768px以上）の時だけ、あの固定動き（パララックス）を有効化 */
        @media (min-width: 768px) {
            .bg-image {
                background-attachment: fixed !important;
            }
        }

        /* 4. テキストのオーバーレイ（最前面設定） */
        .content {
            position: relative;
            z-index: 10; 
            text-align: center;
            padding: 0 20px;
            width: 100%;
        }

        /* 5. 文字のサイズ */
        h1 {
            font-size: 1.2rem;
            font-weight: 200;
            margin-bottom: 20px; 
            color: #ffffff;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            h1 { font-size: 1.5rem; margin-bottom: 30px; }
        }

        p {
            font-size: 0.6rem;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 0.5em;
        }

        @media (min-width: 768px) {
            p { font-size: 0.65rem; }
        }

        .statement {
            font-size: 0.9rem;
            line-height: 2.5;
            color: #cccccc;
            font-weight: 200;
            letter-spacing: 0.3em;
        }

        @media (min-width: 768px) {
            .statement { font-size: 1.1rem; line-height: 3; letter-spacing: 0.4em; }
        }

        /* 6. 連絡先チャンネル */
        .info-channels {
            font-size: 0.7rem;
            color: #888888;
            line-height: 2.5; 
        }

        @media (min-width: 768px) {
            .info-channels { font-size: 0.75rem; line-height: 3; }
        }

        .info-channels a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.4s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            display: inline-block;
        }

        .info-channels a:hover {
            color: #888888;
            border-bottom-color: #888888;
        }

        .scroll-line {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, #333, transparent);
            z-index: 2;
        }

        @media (min-width: 768px) {
            .scroll-line { bottom: 40px; height: 60px; }
        }

        .coming-soon-text {
            font-family: 'Cinzel', serif;
            font-size: 1.0rem;
            color: #ffffff;
            letter-spacing: 0.5em;
            line-height: 2;
        }

        @media (min-width: 768px) {
            .coming-soon-text { font-size: 1.2rem; letter-spacing: 0.6em; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@200;400&family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">
</head>
<body>

    <section id="hero">
        <div class="bg-image" style="background-image: url('./縦長モノクロの小滝.png');"></div>
        <div class="scroll-line"></div>
    </section>

    <section id="statement">
        <div class="bg-image" style="background-image: url('./Sacred Void.png');"></div>
        <div class="content">
            <p class="statement" style="font-family: 'Cinzel', serif;">
                Japanese Craftsmanship, Reimagined.
            </p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="space">
        <div class="bg-image" style="background-image: url('./Minimal Japanese Silence.png');"></div>
        <div class="content">
            <h1>SILENCE</h1>
            <p>The Aesthetics of Absence</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="craft">
        <div class="bg-image" style="background-image: url('./Kumiko Shadow on Washi Paper.png');"></div>
        <div class="content">
            <h1>SHADE</h1>
            <p>Geometry of Wood and Light</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="shade-interior">
        <div class="bg-image" style="background-image: url('./interior-shade.png');"></div>
        <div class="content">
            <h1>INTERIOR SHADE</h1>
            <p>Geometry of Wood and Light</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="staircase">
        <div class="bg-image" style="background-image: url('./Staircase in Shadow Light.png');"></div>
        <div class="content">
            <h1>LIGHT AND LINE</h1>
            <p>The Architecture of Shadow</p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="artisan">
        <div class="bg-image" style="background-image: url('./artisan-shadow.png');"></div>
        <div class="content">
            <p class="coming-soon-text">
                UNVEILING SOON<br>
                <span style="font-size: 0.65rem; color: #777777; letter-spacing: 0.3em;">The Hands of the Masters</span>
            </p>
        </div>
        <div class="scroll-line"></div>
    </section>

    <section id="contact" style="background-color: #000000;">
        <div class="content">
            <h1>CONTACT</h1>
             
            <div class="info-channels">
                <p>MAIL: <a href="mailto:info@ma-and-kage.com">info@ma-and-kage.com</a></p>
                <p>INSTAGRAM: <a href="https://instagram.com/ma_and_kage" target="_blank">@ma_and_kage</a></p>
            </div>
        </div>
    </section>

    <script>
        const setVh = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', setVh);
        window.addEventListener('DOMContentLoaded', setVh);
        setVh();
    </script>
</body>
</html>
